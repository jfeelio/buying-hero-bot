name: Automation Status

# Daily ~7:07 AM ET (11:07 UTC; off the hour, GitHub delays on-the-hour crons),
# plus "Run workflow" for a manual refresh. Checks every GitHub Actions job and
# n8n workflow and writes the result to a private Drive file that the
# Automations Hub artifact reads. Nothing is committed to this public repo.
on:
  schedule:
    - cron: '7 11 * * *'
  workflow_dispatch:

concurrency:
  group: automation-status
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      AUTOMATION_STATUS_FILE_ID: ${{ secrets.AUTOMATION_STATUS_FILE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: automation-status/requirements.txt

      - name: Install dependencies
        run: pip install -r automation-status/requirements.txt

      - name: Collect status
        working-directory: automation-status
        run: python collect.py
