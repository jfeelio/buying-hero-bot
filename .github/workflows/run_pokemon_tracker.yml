name: Pokemon Tracker

on:
  schedule:
    - cron: '0 12 * * *'   # 7 AM ET daily (after TCGCSV nightly refresh)
  workflow_dispatch:

concurrency:
  group: pokemon-tracker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # n8n starts this job on time with "Run workflow"; GitHub's own schedule runs
  # hours late and is only the backup. The backup stands down when an on-time
  # run in the last 20 hours succeeded or is still going.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          N=$(gh run list -R "${{ github.repository }}" --workflow "${{ github.workflow }}" -e workflow_dispatch -L 20                 --json createdAt,status,conclusion                 --jq '[.[] | select((now - (.createdAt | fromdateiso8601)) < 72000 and (.conclusion == "success" or .status != "completed"))] | length')
          echo "on-time runs in the last 20h: $N"
          if [ "${N:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  run:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pokemon-${{ hashFiles('pokemon-tracker/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-pokemon-

      - name: Install dependencies
        run: pip install -r pokemon-tracker/requirements.txt

      - name: Write credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > pokemon-tracker/credentials.json

      - name: Run tracker
        run: python main.py
        working-directory: pokemon-tracker
        env:
          GOOGLE_CREDS_PATH: credentials.json
