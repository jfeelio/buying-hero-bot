name: Probate Pipeline

on:
  schedule:
    - cron: '23 6 * * 1-5'   # ~2:23 AM ET Mon–Fri: the Clerk times out broad searches at peak hours
  workflow_dispatch:

concurrency:
  group: probate-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('foreclosure-agent/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -r foreclosure-agent/requirements.txt

      - name: Write credentials & .env
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > foreclosure-agent/credentials.json
          cat > foreclosure-agent/.env << 'ENVEOF'
          GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_PATH=credentials.json
          PROBATE_GOOGLE_SHEET_ID=${{ secrets.PROBATE_GOOGLE_SHEET_ID }}
          PROBATE_SHEET_TAB_NAME=${{ secrets.PROBATE_SHEET_TAB_NAME }}
          PROBATE_DAYS_BACK=${{ secrets.PROBATE_DAYS_BACK }}
          CLERK_USERNAME=${{ secrets.CLERK_USERNAME }}
          CLERK_PASSWORD=${{ secrets.CLERK_PASSWORD }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          ENVEOF

      - name: Run probate pipeline
        id: pipeline
        run: |
          set +e
          python main_probate.py 2>&1 | tee /tmp/output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          ROWS=$(grep -oP 'Probate pipeline complete\. \K\d+(?= row)' /tmp/output.txt | tail -1)
          ROWS=${ROWS:-0}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "rows_added=$ROWS"     >> "$GITHUB_OUTPUT"
        working-directory: foreclosure-agent

      - name: Update pipeline_status.json
        if: always()
        run: |
          python - << 'EOF'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('docs/data/pipeline_status.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          data = json.loads(p.read_text()) if p.exists() else {}

          run_id = os.environ['RUN_ID']
          data['probate'] = {
              'last_run':      datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'status':        'success' if os.environ['EXIT_CODE'] == '0' else 'failure',
              'records_added': int(os.environ.get('ROWS', 0) or 0),
              'run_id':        run_id,
              'run_url':       f'https://github.com/jfeelio/buying-hero-bot/actions/runs/{run_id}',
          }
          p.write_text(json.dumps(data, indent=2))
          print(f"Status written: {data['probate']['status']}, {data['probate']['records_added']} rows")
          EOF
        env:
          EXIT_CODE: ${{ steps.pipeline.outputs.exit_code }}
          ROWS:      ${{ steps.pipeline.outputs.rows_added }}
          RUN_ID:    ${{ github.run_id }}

      - name: Commit & push results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/pipeline_status.json
          git add -f foreclosure-agent/seen_probate_cases.json 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing new to commit." && exit 0
          git commit -m "chore: probate $(date -u +%Y-%m-%d) — ${{ steps.pipeline.outputs.rows_added }} row(s) added"
          # Another job may have pushed meanwhile: replay this commit on top (our side wins a
          # clash in pipeline_status.json) and retry. The old pull-then-commit order dropped
          # the staged change when a concurrent push arrived and failed the run.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin master && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
